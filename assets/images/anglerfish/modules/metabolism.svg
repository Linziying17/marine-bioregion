<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',system-ui,sans-serif">
  <title>代谢生理学 常规代谢率对比柱状图</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2438"/><stop offset="1" stop-color="#060f1a"/>
    </linearGradient>
    <linearGradient id="barM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#c9971f"/>
    </linearGradient>
    <linearGradient id="barO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d8fae"/><stop offset="1" stop-color="#3a5f78"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" rx="18" fill="url(#bg)"/>
  <text x="30" y="44" font-size="26" font-weight="700" fill="#e8f4fb">代谢生理学</text>
  <text x="30" y="68" font-size="15" fill="#7fd8ff">常规代谢率对比柱状图 — Cowles &amp; Childress (1995), 5°C 氧电极实测</text>

  <!-- ============ 常规代谢率对比柱状图 ============ -->
  <g transform="translate(210,105)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#ffd166">常规代谢率对比</text>
    <text x="0" y="20" font-size="12" fill="#9db8cc">μmol O₂ g⁻¹ h⁻¹（越低越节能）</text>

    <!-- 坐标 -->
    <line x1="30" y1="370" x2="370" y2="370" stroke="#5d7689" stroke-width="1.5"/>
    <line x1="30" y1="370" x2="30" y2="40" stroke="#5d7689" stroke-width="1.5"/>
    <g font-size="11" fill="#9db8cc" text-anchor="end">
      <line x1="26" y1="370" x2="30" y2="370" stroke="#9db8cc"/><text x="22" y="374">0</text>
      <line x1="26" y1="290" x2="30" y2="290" stroke="#9db8cc"/><text x="22" y="294">0.4</text>
      <line x1="26" y1="210" x2="30" y2="210" stroke="#9db8cc"/><text x="22" y="214">0.8</text>
      <line x1="26" y1="130" x2="30" y2="130" stroke="#9db8cc"/><text x="22" y="134">1.2</text>
      <line x1="26" y1="50" x2="30" y2="50" stroke="#9db8cc"/><text x="22" y="54">1.6</text>
    </g>

    <!-- Oneirodes 0.15–0.21 -->
    <rect x="52" y="338" width="40" height="32" fill="url(#barO)"/>
    <rect x="52" y="338" width="40" height="32" fill="none" stroke="#7fa8c4" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="72" y="328" font-size="10" fill="#7fa8c4" text-anchor="middle">0.15–0.21</text>
    <text x="72" y="392" font-size="11.5" fill="#9db8cc" text-anchor="middle">Oneirodes</text>
    <text x="72" y="406" font-size="10" fill="#5d8fae" text-anchor="middle">（同策略更低）</text>

    <!-- M. johnsonii 0.486 -->
    <rect x="112" y="224" width="52" height="146" fill="url(#barM)" stroke="#ffe9a8" stroke-width="2"/>
    <text x="138" y="214" font-size="12" font-weight="800" fill="#ffd166" text-anchor="middle">0.486 ★</text>
    <text x="138" y="392" font-size="12.5" font-weight="700" fill="#ffd166" text-anchor="middle">M. johnsonii</text>
    <text x="138" y="406" font-size="10" fill="#9db8cc" text-anchor="middle">本种</text>

    <!-- 金眼鲷 0.89–1.25 -->
    <rect x="184" y="123" width="40" height="247" fill="url(#barO)" opacity="0.85"/>
    <rect x="184" y="76" width="40" height="294" fill="#5d8fae" opacity="0.25"/>
    <text x="204" y="66" font-size="10" fill="#9db8cc" text-anchor="middle">0.89–1.25</text>
    <text x="204" y="392" font-size="11.5" fill="#9db8cc" text-anchor="middle">金眼鲷</text>
    <text x="204" y="406" font-size="10" fill="#5d8fae" text-anchor="middle">A. cornuta</text>

    <!-- Chiasmodon 1.1 -->
    <rect x="244" y="122" width="40" height="248" fill="url(#barO)"/>
    <text x="264" y="112" font-size="10" fill="#9db8cc" text-anchor="middle">1.1</text>
    <text x="264" y="392" font-size="11.5" fill="#9db8cc" text-anchor="middle">C. niger</text>
    <text x="264" y="406" font-size="10" fill="#5d8fae" text-anchor="middle">叉齿鱼</text>

    <!-- Stomias 1.3 -->
    <rect x="304" y="72" width="40" height="298" fill="url(#barO)"/>
    <text x="324" y="62" font-size="10" fill="#9db8cc" text-anchor="middle">1.3</text>
    <text x="324" y="392" font-size="11.5" fill="#9db8cc" text-anchor="middle">S. danae</text>
    <text x="324" y="406" font-size="10" fill="#5d8fae" text-anchor="middle">巨口鱼</text>
  </g>

  <text x="450" y="585" font-size="13" fill="#9db8cc" text-anchor="middle">本种代谢率仅为活跃巡游捕食者的 1/2–1/3；仅同策略的 Oneirodes 属更低</text>
</svg>
